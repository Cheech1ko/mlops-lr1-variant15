stages:
  prepare:
    cmd: python -m src.prepare
    deps:
      - src/prepare.py
      - src/schema.py
      - src/utils.py
      - data/raw/diabetic_data.csv
    params:
      - data
      - train.seed
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  featurize:
    cmd: python -m src.featurize
    deps:
      - src/featurize.py
      - src/utils.py
      - data/processed/train.csv
      - data/processed/test.csv
    params:
      - data.target
      - data.drop
      - featurize
    outs:
      - data/features/train.csv
      - data/features/test.csv
      - models/preprocessor.joblib

  train:
    cmd: python -m src.train
    deps:
      - src/train.py
      - src/tracking.py
      - src/utils.py
      - data/features/train.csv
    params:
      - train
      - mlflow
    outs:
      - models/model.joblib

  evaluate:
    cmd: python -m src.evaluate
    deps:
      - src/evaluate.py
      - src/tracking.py
      - src/utils.py
      - models/model.joblib
      - data/features/test.csv
    params:
      - evaluate
      - data.target
    metrics:
      - reports/metrics.json:
          cache: false
    plots:
      - reports/plots/confusion_matrix.csv:
          cache: false
